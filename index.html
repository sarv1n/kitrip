<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kangaroo Island, 30 Sep to 5 Oct</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9f0ef;--card:#fff;--ink:#12303b;--muted:#587079;--line:#cfdcdc;--sea:#0f7c86;--lichen:#b8860b;--warn:#fff3d6;--wet:#dcecf5;--chip:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1d24;--card:#15303a;--ink:#e6f0f0;--muted:#93aab2;--line:#274650;--sea:#4cc3cc;--lichen:#e0b64a;--warn:#3a3218;--wet:#173a4d;--chip:#15303a}}
:root[data-theme="dark"]{--bg:#0d1d24;--card:#15303a;--ink:#e6f0f0;--muted:#93aab2;--line:#274650;--sea:#4cc3cc;--lichen:#e0b64a;--warn:#3a3218;--wet:#173a4d;--chip:#15303a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:640px;margin:0 auto}
h1{font:600 26px/1.15 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 4px}a{color:var(--sea)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:6px 12px;font:inherit;text-align:center;cursor:pointer;min-width:58px}
.chip b{display:block;font-size:15px}.chip span{font-size:12px;color:var(--muted)}
.chip[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.chip[aria-selected="true"] span{color:#e8f6f7}
.chip:focus-visible,.tog:focus-visible,label:focus-within{outline:3px solid var(--lichen);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:12px 16px 32px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tog{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--wet);border-color:var(--sea)}
h2{font:600 22px/1.2 Georgia,serif;margin:0}
.date{color:var(--muted);font-size:14px;margin:2px 0 10px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.fact b{display:block;font-size:15px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li label{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
li input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--sea);flex:0 0 auto}
.t{font-weight:600}.d{color:var(--sea);font-size:13px;font-weight:600}
.n{color:var(--muted);font-size:14px}
li.done .t{text-decoration:line-through;color:var(--muted)}
li.opt label{border-style:dashed}
.box{margin-top:12px;border-radius:12px;padding:12px;font-size:14px}
.skip{background:var(--warn)}.wetbox{background:var(--wet)}.out{background:var(--card);border:1px solid var(--line)}
.box b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<header>
<h1>Kangaroo Island</h1>
<p class="sub">30 Sep to 5 Oct · based at Emu Bay</p><p class="sub"><a href="https://maps.google.com/?q=Hawthorn+Ave,+Emu+Bay+SA+5223">Hawthorn Ave, Emu Bay 5223</a><br>Sunrise 6:00am · Sunset 6:20pm</p>
</header>
<nav><div class="chips" id="chips" role="tablist" aria-label="Days"></div></nav>
<main>
<div class="bar"><span class="n" id="prog"></span><button class="tog" id="wet" aria-pressed="false">Wet weather plan</button></div>
<section id="day" aria-live="polite"></section>
<p class="n" style="margin-top:16px">Opening hours come from listings and can change. Check before you go.</p>
</main>
<script>
var D=[
{k:"Wed",d:"30 Sep",t:"Arrive: Adelaide to Emu Bay",walk:"1-2 km",len:"Ferry day",
s:[["Ferry ride","","Cape Jervis to Penneshaw."],["Lunch: Millie Mae's Pantry, Penneshaw","","Recommended by the Airbnb owner. Panini, cake, garden and deck. Listed as open daily 7:30am-4pm."],["Prospect Hill walk","","",1],["Flavours of Petit Provence farm stall","","Groceries, jam and more.",1],["Kingscote stop","","Groceries and restaurants."],["Emu Bay","30-60 min","Beach, rock pools if conditions allow, short walk, then sunset at 6:20pm. Spread out, not in one go."],["Stokes Bay","","If time and energy allow.",1]],
skip:"Cape Willoughby, Ironstone Hill (4 km, 1½ h), any long coastal hike. Ironstone Hill can wait for another trip.",out:"White Verish + green skort + Agathe + blue windbreaker"},
{k:"Thu",d:"1 Oct",t:"Seal Bay, dunes and Vivonne Bay",walk:"2-3 km",len:"About 6 h out and back",
s:[["Seal Bay","45-60 min","900 m return accessible boardwalk. Book ahead."],["Little Sahara","1-1½ h","Sandboarding or tobogganing. Stop before everyone is worn out."],["Lunch: Vivonne Bay General Store","30-45 min","Home of the KI whiting burger. Then a beach run-around."],["Kangaroo Island Wildlife Park","","Only if the kids still have energy.",1]],
out:"White Verish + green skort + Agathe. Windbreaker in the car."},
{k:"Fri",d:"2 Oct",t:"Flinders Chase",walk:"About 2 km",len:"About 6-7 h, leave ~8am",star:1,
s:[["Flinders Chase Visitor Centre","","Start here."],["Remarkable Rocks","30-45 min","Protect this one."],["Lunch","","Pack a picnic (shop in Kingscote earlier). Check what is open at the visitor centre."],["Admirals Arch","30-45 min","Steep with steps. Reaching the bottom is not mandatory with the 4-year-old."],["Cape du Couedic Lighthouse","10-20 min","Photo or quick look only."]],
wet:[["Flinders Chase Visitor Centre","","Start here."],["Remarkable Rocks","30-45 min","Keep this."],["Lunch","","Pack a picnic. Eat in the car if it is wet."],["Admirals Arch","15-20 min","Shortened: top viewpoints only."]],
wetnote:"Cut the lighthouse first, then shorten Admirals Arch. Keep Remarkable Rocks.",out:"Layers, and the blue windbreaker on."},
{k:"Sat",d:"3 Oct",t:"Flexible or recovery day",walk:"1-3 km",len:"Relaxed",
s:[["Kingscote","","Start in town."],["Reeves Point and short coastal section","1-1½ h total walk","About 2-3 km if dry."],["Lunch","","So Sando (Wed to Sun, 7:30am-3pm) or Cactus for coffee."],["Pelican feeding","","Kingscote wharf."]],
wet:[["Kingscote lunch and town","","So Sando (Wed to Sun, 7:30am-3pm) or Cactus for coffee."],["Reeves Point","","Quick visit only."],["Pelican feeding","",""],["Café and indoor time","",""]],
wetnote:"Forecast around 13°C with rain possible. Walk about 1 km. If everyone is tired after Friday, this is the recovery day."},
{k:"Sun",d:"4 Oct",t:"Penneshaw and Kingscote",walk:"2-3 km",len:"1-1½ h walking",
s:[["Penneshaw coastal walk","30-45 min","Choose one section only."],["Frenchman Rock","","Quick stop."],["Lunch","","Millie Mae's Pantry (open daily to 4pm) or Fat Beagle Coffee Shop (7am-2pm)."],["Reeves Point, Kingscote","30-45 min",""],["Pelican feeding","",""],["Bay of Shoals Winery","","If everyone still has energy.",1]],
skip:"The full Kingscote Town Walk (6.5 km return to Brownlow Beach plus a 6 km loop). Too much for a 4-year-old."},
{k:"Mon",d:"5 Oct",t:"Home: ferry to Glenelg",walk:"Minimal",len:"Easy day",
s:[["Ferry","",""],["Glenelg","",""],["Jetty Road","","Keep it easy."]]}
];
var cur=0,wetOn=false,saved={};
try{saved=JSON.parse(localStorage.getItem("ki")||"{}")}catch(e){}
function save(){try{localStorage.setItem("ki",JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function chips(){document.getElementById("chips").innerHTML=D.map(function(x,i){return '<button class="chip" role="tab" aria-selected="'+(i==cur)+'" data-i="'+i+'"><b>'+x.k+(x.star?' ★':'')+'</b><span>'+x.d+'</span></button>'}).join("")}
function render(){
 var x=D[cur],useWet=wetOn&&x.wet,st=useWet?x.wet:x.s,h='';
 h+='<h2>'+esc(x.t)+'</h2><p class="date">'+x.k+' '+x.d+'</p>';
 h+='<div class="facts"><div class="fact">Walking<b>'+x.walk+'</b></div><div class="fact">Day<b>'+x.len+'</b></div></div><ul>';
 st.forEach(function(s,j){var id=cur+(useWet?"w":"s")+j,on=saved[id];
  h+='<li class="'+(on?'done':'')+(s[3]?' opt':'')+'"><label><input type="checkbox" data-id="'+id+'"'+(on?' checked':'')+'><span><span class="t">'+esc(s[0])+(s[3]?' (optional)':'')+'</span>'+(s[1]?'<br><span class="d">'+esc(s[1])+'</span>':'')+(s[2]?'<br><span class="n">'+esc(s[2])+'</span>':'')+'</span></label></li>'});
 h+='</ul>';
 if(x.wetnote&&(useWet||!x.wet||1))h+='<div class="box wetbox"><b>If wet or windy</b>'+esc(x.wetnote)+'</div>';
 if(x.skip)h+='<div class="box skip"><b>Skip</b>'+esc(x.skip)+'</div>';
 if(x.out)h+='<div class="box out"><b>Outfit</b>'+esc(x.out)+'</div>';
 document.getElementById("day").innerHTML=h;
 var n=st.length,c=st.filter(function(s,j){return saved[cur+(useWet?"w":"s")+j]}).length;
 document.getElementById("prog").textContent=c+" of "+n+" done";
 chips();
}
document.getElementById("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(b){cur=+b.dataset.i;render();window.scrollTo(0,0)}});
document.getElementById("day").addEventListener("change",function(e){var id=e.target.dataset.id;if(id){saved[id]=e.target.checked;save();render()}});
document.getElementById("wet").addEventListener("click",function(){wetOn=!wetOn;this.setAttribute("aria-pressed",wetOn);render()});
render();
</script>
</body>
</html>
